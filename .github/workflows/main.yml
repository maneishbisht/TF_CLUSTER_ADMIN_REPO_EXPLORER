name: Terraform Apply & Configure Argo CD

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

  DEV_CLUSTER_NAME: dev_cluster
  TEST_CLUSTER_NAME: test_cluster
  PROD_CLUSTER_NAME: prod_cluster

  KUBECONFIG: ${{ github.workspace }}/kubeconfig

  # The bootstrap Applications point to this repository.
  # Keep this secret as the exact Git URL registered with Argo CD.
  TF_VAR_application_config_repo_url: ${{ secrets.REPO_EXPLORER_APPLICATION_CONFIG }}

jobs:
  terraform-and-argocd:
    name: Terraform + Argo CD Bootstrap
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      CLUSTER_ADMIN_ROLE_ARN: ${{ secrets.CLUSTER_ADMIN_ROLE_ARN }}

      APPLICATION_CONFIG_REPO: ${{ secrets.REPO_EXPLORER_APPLICATION_CONFIG }}
      FRONTEND_REPO: ${{ secrets.REPO_EXPLORER_FRONTEND_CONFIG }}
      BACKEND_REPO: ${{ secrets.REPO_EXPLORER_BACKEND_CONFIG }}
      CONFIG_REPO_PAT: ${{ secrets.CONFIG_REPO_PAT }}

    steps:

      # ============================================================
      # 1. Checkout Terraform Repository
      # ============================================================
      - name: Checkout Terraform Repository
        uses: actions/checkout@v4
        with:
          ref: master


      # ============================================================
      # 2. Verify Initial AWS Identity
      # ============================================================
      - name: Verify Initial AWS Identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity


      # ============================================================
      # 3. Assume Cluster Admin Role
      # ============================================================
      - name: Assume Cluster Admin Role
        run: |
          set -euo pipefail

          aws sts assume-role \
            --role-arn "$CLUSTER_ADMIN_ROLE_ARN" \
            --role-session-name "github-actions-${GITHUB_RUN_ID}" \
            > /tmp/cluster-admin-role.json

          CREDS=$(cat /tmp/cluster-admin-role.json)

          echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"

          echo "AWS identity after assuming Cluster Admin Role:"
          aws sts get-caller-identity


      # ============================================================
      # 4. Create or Update EKS Kubeconfig
      # ============================================================
      - name: Create or Update EKS Kubeconfig
        run: |
          set -euo pipefail

          rm -f "$KUBECONFIG"

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$DEV_CLUSTER_NAME" \
            --alias "$DEV_CLUSTER_NAME" \
            --kubeconfig "$KUBECONFIG"

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$TEST_CLUSTER_NAME" \
            --alias "$TEST_CLUSTER_NAME" \
            --kubeconfig "$KUBECONFIG"

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$PROD_CLUSTER_NAME" \
            --alias "$PROD_CLUSTER_NAME" \
            --kubeconfig "$KUBECONFIG"

          kubectl config get-contexts


      # ============================================================
      # 5. Set Argo CD control-plane namespace for dev
      # ============================================================
      - name: Set Argo CD control-plane namespace for dev
        run: |
          set -euo pipefail

          kubectl config set-context "$DEV_CLUSTER_NAME" \
            --namespace=argocd


      # ============================================================
      # 6. Set Argo CD control-plane namespace for test
      # ============================================================
      - name: Set Argo CD control-plane namespace for test
        run: |
          set -euo pipefail

          kubectl config set-context "$TEST_CLUSTER_NAME" \
            --namespace=argocd


      # ============================================================
      # 7. Set Argo CD control-plane namespace for prod
      # ============================================================
      - name: Set Argo CD control-plane namespace for prod
        run: |
          set -euo pipefail

          kubectl config set-context "$PROD_CLUSTER_NAME" \
            --namespace=argocd


      # ============================================================
      # 8. Setup Terraform
      # ============================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0


      # ============================================================
      # 9. Terraform Init
      # ============================================================
      - name: Terraform Init
        run: terraform init


      # ============================================================
      # 10. Terraform Validate
      # ============================================================
      - name: Terraform Validate
        run: terraform validate


      # ------------------------------------------------------------
      # First stage: only create Argo CD itself.
      # The Application CRD is required before Terraform creates the
      # bootstrap Application manifests in stage two.
      # ------------------------------------------------------------

      - name: Cleanup Existing ArgoCD Releases and Namespaces
        run: |
          set -e

          for cluster in "$DEV_CLUSTER_NAME" "$PROD_CLUSTER_NAME"; do
            echo "Cleaning up ArgoCD remnants on cluster: $cluster"

            # 1. Delete Helm release tracking secrets and configmaps if they exist
            kubectl --context "$cluster" delete secret -n argocd -l owner=helm --ignore-not-found=true
            kubectl --context "$cluster" delete configmap -n argocd -l owner=helm --ignore-not-found=true

            # 2. Force delete the namespace if it exists
            if kubectl --context "$cluster" get namespace argocd >/dev/null 2>&1; then
              echo "Deleting 'argocd' namespace on $cluster..."
              kubectl --context "$cluster" delete namespace argocd --wait=true
            fi

            # 3. Clean up cluster-scoped ArgoCD CRDs that might block re-installation
            echo "Checking for leftover ArgoCD CRDs on $cluster..."
            kubectl --context "$cluster" get crd -o name | grep argoproj.io | xargs -r kubectl --context "$cluster" delete --wait=true || true
          done

          echo "Waiting 10 seconds for cluster state to settle..."
          sleep 10


      - name: Install Argo CD on Dev and Prod
        run: |
          set -euo pipefail

          terraform apply \
            -target=module.dev.helm_release.argocd[0] \
            -target=module.prod.helm_release.argocd[0] \
            -auto-approve

      - name: Diagnose Argo CD Installation
        if: failure()
        run: |
          set +e

          echo "===== DEV ARGO CD ====="
          kubectl --context "$DEV_CLUSTER_NAME" -n argocd get pods -o wide
          kubectl --context "$DEV_CLUSTER_NAME" -n argocd get events --sort-by='.lastTimestamp'

          echo ""
          echo "===== PROD ARGO CD ====="
          kubectl --context "$PROD_CLUSTER_NAME" -n argocd get pods -o wide
          kubectl --context "$PROD_CLUSTER_NAME" -n argocd get events --sort-by='.lastTimestamp'

      - name: Wait for CRDs to Register
        run: sleep 30


      - name: Install Argo CD CLI
        run: |
          set -euo pipefail

          VERSION=$(curl -L -s https://api.github.com/repos/argoproj/argo-cd/releases/latest | jq -r '.tag_name')

          curl -L -sS \
            -o /tmp/argocd \
            "https://github.com/argoproj/argo-cd/releases/download/${VERSION}/argocd-linux-amd64"

          sudo install -m 555 /tmp/argocd /usr/local/bin/argocd
          argocd version --client


      - name: Verify EKS Cluster Access
        run: |
          set -euo pipefail

          kubectl --context "$DEV_CLUSTER_NAME" get nodes
          kubectl --context "$TEST_CLUSTER_NAME" get nodes
          kubectl --context "$PROD_CLUSTER_NAME" get nodes


      - name: Verify Argo CD Control Plane Configuration
        run: |
          set -euo pipefail

          for cluster in "$DEV_CLUSTER_NAME" "$PROD_CLUSTER_NAME"; do
            kubectl --context "$cluster" \
              --namespace argocd \
              get configmap argocd-cm

            kubectl --context "$cluster" \
              --namespace argocd \
              get configmap argocd-cmd-params-cm
          done


      # ------------------------------------------------------------
      # The dev Argo CD control plane manages test_cluster remotely.
      # ------------------------------------------------------------

      - name: Register Test Cluster in Dev Argo CD
        run: |
          set -euo pipefail

          argocd cluster add "$TEST_CLUSTER_NAME" \
            --core \
            --kube-context "$DEV_CLUSTER_NAME" \
            --upsert \
            --yes


      # ------------------------------------------------------------
      # Register all Git repositories required by the bootstrap
      # Applications and their child Applications.
      # ------------------------------------------------------------

      - name: Add Application Config Repository to Dev Argo CD
        run: |
          set -euo pipefail

          argocd repo add "$APPLICATION_CONFIG_REPO" \
            --core \
            --kube-context "$DEV_CLUSTER_NAME" \
            --username "x-access-token" \
            --password "$CONFIG_REPO_PAT" \
            --upsert


      - name: Add Frontend Config Repository to Dev Argo CD
        run: |
          set -euo pipefail

          argocd repo add "$FRONTEND_REPO" \
            --core \
            --kube-context "$DEV_CLUSTER_NAME" \
            --username "x-access-token" \
            --password "$CONFIG_REPO_PAT" \
            --upsert


      - name: Add Backend Config Repository to Dev Argo CD
        run: |
          set -euo pipefail

          argocd repo add "$BACKEND_REPO" \
            --core \
            --kube-context "$DEV_CLUSTER_NAME" \
            --username "x-access-token" \
            --password "$CONFIG_REPO_PAT" \
            --upsert


      - name: Add Application Config Repository to Prod Argo CD
        run: |
          set -euo pipefail

          argocd repo add "$APPLICATION_CONFIG_REPO" \
            --core \
            --kube-context "$PROD_CLUSTER_NAME" \
            --username "x-access-token" \
            --password "$CONFIG_REPO_PAT" \
            --upsert


      - name: Add Frontend Config Repository to Prod Argo CD
        run: |
          set -euo pipefail

          argocd repo add "$FRONTEND_REPO" \
            --core \
            --kube-context "$PROD_CLUSTER_NAME" \
            --username "x-access-token" \
            --password "$CONFIG_REPO_PAT" \
            --upsert


      - name: Add Backend Config Repository to Prod Argo CD
        run: |
          set -euo pipefail

          argocd repo add "$BACKEND_REPO" \
            --core \
            --kube-context "$PROD_CLUSTER_NAME" \
            --username "x-access-token" \
            --password "$CONFIG_REPO_PAT" \
            --upsert


      # ------------------------------------------------------------
      # Second stage: create the Terraform-owned bootstrap
      # Applications only. The Helm chart then owns all child
      # Application manifests.
      # ------------------------------------------------------------

      - name: Terraform Apply Bootstrap Applications
        run: |
          set -euo pipefail
          terraform apply -auto-approve


      - name: Verify Dev Argo CD
        run: |
          set -euo pipefail

          echo "===== Dev Argo CD Clusters ====="
          argocd cluster list \
            --core \
            --kube-context "$DEV_CLUSTER_NAME"

          echo "===== Dev Argo CD Repositories ====="
          argocd repo list \
            --core \
            --kube-context "$DEV_CLUSTER_NAME"

          echo "===== Dev Argo CD Applications ====="
          argocd app list \
            --core \
            --kube-context "$DEV_CLUSTER_NAME"


      - name: Verify Prod Argo CD
        run: |
          set -euo pipefail

          echo "===== Prod Argo CD Clusters ====="
          argocd cluster list \
            --core \
            --kube-context "$PROD_CLUSTER_NAME"

          echo "===== Prod Argo CD Repositories ====="
          argocd repo list \
            --core \
            --kube-context "$PROD_CLUSTER_NAME"

          echo "===== Prod Argo CD Applications ====="
          argocd app list \
            --core \
            --kube-context "$PROD_CLUSTER_NAME"