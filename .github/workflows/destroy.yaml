name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

  DEV_CLUSTER_NAME: dev_cluster
  TEST_CLUSTER_NAME: test_cluster
  #PROD_CLUSTER_NAME: prod_cluster

jobs:
  terraform-destroy:
    name: Destroy Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # CHECKOUT TERRAFORM REPOSITORY
      # ---------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # CONFIGURE INITIAL AWS CREDENTIALS + ASSUME CLUSTER ADMIN
      # ---------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          role-to-assume: ${{ secrets.CLUSTER_ADMIN_ROLE_ARN }}

          role-skip-session-tagging: true
      # ---------------------------------------------------------
      # VERIFY THE ASSUMED IAM ROLE
      # ---------------------------------------------------------

      - name: Verify AWS Identity
        run: |
          set -euo pipefail

          echo "AWS identity being used:"
          aws sts get-caller-identity

      # ---------------------------------------------------------
      # VERIFY ACCESS TO ALL THREE EKS CLUSTERS
      #
      # This does NOT create kubeconfig.
      # It simply verifies that the assumed role can access
      # the EKS control planes.
      # ---------------------------------------------------------

      - name: Verify EKS Access
        run: |
          set -euo pipefail

          echo "Checking DEV cluster..."
          aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$DEV_CLUSTER_NAME" \
            --query 'cluster.name' \
            --output text

          echo "Checking TEST cluster..."
          aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$TEST_CLUSTER_NAME" \
            --query 'cluster.name' \
            --output text

          #echo "Checking PROD cluster..."
          #aws eks describe-cluster \
          #  --region "$AWS_REGION" \
          #  --name "$PROD_CLUSTER_NAME" \
          #  --query 'cluster.name' \
          #  --output text

      # ---------------------------------------------------------
      # SETUP TERRAFORM
      # ---------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      # ---------------------------------------------------------
      # INITIALIZE TERRAFORM
      # ---------------------------------------------------------

      - name: Terraform Init
        run: |
          set -euo pipefail

          terraform init -input=false

      # ---------------------------------------------------------
      # OPTIONAL VALIDATION
      # ---------------------------------------------------------

      - name: Terraform Validate
        run: |
          set -euo pipefail

          terraform validate

      # ---------------------------------------------------------
      # DESTROY EVERYTHING MANAGED BY THIS TERRAFORM STATE
      # ---------------------------------------------------------

      - name: Terraform Destroy
        run: |
          set -euo pipefail

          terraform destroy \
            -input=false \
            -auto-approve